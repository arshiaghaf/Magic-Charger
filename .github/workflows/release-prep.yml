name: Release preparation
on:
  pull_request:
    paths:
      - .github/workflows/release-prep.yml
      - Sources/**
      - Tests/**
      - Package.swift
      - Package.resolved
      - LICENSE
      - build-app.sh
      - VERSION
      - BUILD_NUMBER
      - assets/**
      - scripts/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build release app
        run: CONFIGURATION=release sh build-app.sh
      - name: Prepare disk image and checksum
        run: sh scripts/package-dmg.sh
      - name: Check packaging regressions
        run: sh Tests/Packaging/check-artifacts.sh
      - name: Verify release metadata
        run: |
          test "$(lipo -archs 'build/Magic Charger.app/Contents/MacOS/MagicCharger')" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'build/Magic Charger.app/Contents/Info.plist')" = co.arshia.magiccharger
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'build/Magic Charger.app/Contents/Info.plist')" = "$(cat VERSION)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' 'build/Magic Charger.app/Contents/Info.plist')" = "$(cat BUILD_NUMBER)"
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: magic-charger-release-prep
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
